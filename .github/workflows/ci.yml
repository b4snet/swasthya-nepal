# Swasthya backend CI (MASTER_RULES.md §25, DEPLOYMENT.md §6, TESTING_STRATEGY.md).
#
# Pipeline: source check → composer install → static analysis (Pint) →
# DB migrations on a DISPOSABLE PostgreSQL → full Pest suite (unit,
# integration, API, database, RLS/tenant-isolation, audit) → build artifact.
#
# The database is a fresh postgres:16 service container — never a developer's
# local database. The least-privilege `swasthya_app` role is created from
# database/security/roles.sql (NOBYPASSRLS) and the RLS suite runs against it.
#
# No production secrets are committed. The app-role password is environment-
# specific: from the APP_ROLE_PASSWORD secret when available, otherwise a
# CI-only default (the role and password exist only inside this job's
# disposable database).

name: backend-ci

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ROLE_PASSWORD: ${{ secrets.APP_ROLE_PASSWORD || 'ci-app-role-password-2026' }}

jobs:
  backend:
    name: backend (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    continue-on-error: ${{ matrix.php == '8.2' }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: swasthya
          POSTGRES_PASSWORD: ci-owner-password-2026
          POSTGRES_DB: swasthya_ci
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U swasthya"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_pgsql, pgsql, bcmath, intl
          coverage: none
          tools: composer:v2
        timeout-minutes: 10

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ matrix.php }}-
        timeout-minutes: 10

      - name: Install PostgreSQL client (psql for roles.sql / grants.sql / verification)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
        timeout-minutes: 5

      - name: Source check (Laravel skeleton + app namespace)
        run: |
          test -f artisan && test -f composer.json
          test -d app && test -d database/migrations && test -d tests
        timeout-minutes: 1

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
        timeout-minutes: 10

      - name: Static analysis / lint (Pint)
        run: vendor/bin/pint --test
        timeout-minutes: 5

      - name: Create least-privilege application role (NOBYPASSRLS)
        run: |
          PGPASSWORD=ci-owner-password-2026 psql -h 127.0.0.1 -p 54329 -U swasthya -d swasthya_ci \
            -v app_password="$APP_ROLE_PASSWORD" -f database/security/roles.sql
        timeout-minutes: 2

      - name: Database migrations on disposable PostgreSQL
        run: |
          DB_HOST=127.0.0.1 DB_PORT=54329 DB_DATABASE=swasthya_ci \
          DB_USERNAME=swasthya DB_PASSWORD=ci-owner-password-2026 \
          php artisan migrate:fresh --force
        timeout-minutes: 10

      - name: Verify RLS policies and role configuration
        # Fail-closed: assert the tenant-scoped policies on `patients` exist and
        # that the application role has NOBYPASSRLS / no superuser. The view
        # pg_policies exposes policyname/tablename (not polrelid/polname).
        run: |
          set -euo pipefail
          POLICIES=$(PGPASSWORD=ci-owner-password-2026 psql -h 127.0.0.1 -p 54329 -U swasthya -d swasthya_ci -t -A -c \
            "select policyname from pg_policies where schemaname='public' and tablename='patients' order by policyname")
          echo "$POLICIES"
          echo "$POLICIES" | grep -q 'p_rls_patients_select'
          echo "$POLICIES" | grep -q 'p_rls_patients_delete'
          ROLE=$(PGPASSWORD=ci-owner-password-2026 psql -h 127.0.0.1 -p 54329 -U swasthya -d swasthya_ci -t -A -c \
            "select rolname, rolbypassrls, rolsuper from pg_roles where rolname='swasthya_app'")
          echo "$ROLE"
          echo "$ROLE" | grep -q '^swasthya_app|f|f$'
        timeout-minutes: 2

      - name: Run full test suite (unit, integration, API, database, RLS, isolation, audit)
        run: |
          DB_HOST=127.0.0.1 DB_PORT=54329 DB_DATABASE=swasthya_ci \
          DB_USERNAME=swasthya DB_PASSWORD=ci-owner-password-2026 \
          RLS_DB_HOST=127.0.0.1 RLS_DB_PORT=54329 RLS_DB_DATABASE=swasthya_ci \
          RLS_DB_USERNAME=swasthya_app RLS_DB_PASSWORD="$APP_ROLE_PASSWORD" \
          vendor/bin/pest --ci
        timeout-minutes: 30

      - name: Build artifact (laravel optimization for deployment)
        run: |
          DB_HOST=127.0.0.1 DB_PORT=54329 DB_DATABASE=swasthya_ci \
          DB_USERNAME=swasthya DB_PASSWORD=ci-owner-password-2026 \
          php artisan config:cache --env=production || true
          php artisan route:cache || true
          php artisan view:cache || true
          ls -la bootstrap/cache
        timeout-minutes: 10

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pest-failure-php${{ matrix.php }}
          path: backend/storage/logs/
          retention-days: 7

  frontend:
    name: frontend (React SPA)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The frontend job is fully self-contained (own disposable Postgres,
    # migrations, seed, backend boot for E2E) and uses no backend-job output.
    # Gating it behind `needs: backend` starves it whenever a backend matrix
    # leg flakes, so it runs independently and its result stands on its own.

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: swasthya
          POSTGRES_PASSWORD: ci-owner-password-2026
          POSTGRES_DB: swasthya_ci
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U swasthya"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      CI_APP_ROLE_PASSWORD: ${{ secrets.APP_ROLE_PASSWORD || 'ci-app-role-password-2026' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql, pgsql, bcmath, intl
          coverage: none
          tools: composer:v2
        timeout-minutes: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
        timeout-minutes: 5

      - name: Install PostgreSQL client (psql for roles.sql / grants.sql / verification)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
        timeout-minutes: 5

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress
        timeout-minutes: 10

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
        timeout-minutes: 10

      - name: Create least-privilege application role (NOBYPASSRLS)
        run: |
          PGPASSWORD=ci-owner-password-2026 psql -h 127.0.0.1 -p 54329 -U swasthya -d swasthya_ci \
            -v app_password="$CI_APP_ROLE_PASSWORD" -f backend/database/security/roles.sql
        timeout-minutes: 2

      - name: Migrate disposable PostgreSQL
        run: |
          cd backend
          DB_HOST=127.0.0.1 DB_PORT=54329 DB_DATABASE=swasthya_ci \
          DB_USERNAME=swasthya DB_PASSWORD=ci-owner-password-2026 \
          php artisan migrate:fresh --force
        timeout-minutes: 10

      - name: Grant application privileges + seed staging fixture
        run: |
          PGPASSWORD=ci-owner-password-2026 psql -h 127.0.0.1 -p 54329 -U swasthya -d swasthya_ci \
            -v dbname=swasthya_ci -f backend/database/security/grants.sql
          cd backend
          APP_ENV=ci DB_HOST=127.0.0.1 DB_PORT=54329 DB_DATABASE=swasthya_ci \
          DB_USERNAME=swasthya DB_PASSWORD=ci-owner-password-2026 \
          php artisan db:seed --class=StagingFixtureSeeder --force
        timeout-minutes: 10

      - name: Frontend static checks
        working-directory: frontend
        run: |
          npm run typecheck
          npm test
        timeout-minutes: 15

      - name: Frontend production build
        working-directory: frontend
        run: npm run build
        timeout-minutes: 10

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
        timeout-minutes: 15

      - name: E2E (desktop + mobile OPD workflow + accessibility) on disposable PostgreSQL
        working-directory: frontend
        env:
          SWASTHYA_E2E_BASE_URL: http://127.0.0.1:5175
        run: |
          mkdir -p test-results
          npx playwright test --config=playwright.ci.config.ts 2>&1 | tee test-results/e2e-output.txt
        timeout-minutes: 15

      - name: Surface E2E failure output as annotations
        if: failure()
        working-directory: frontend
        run: |
          echo "::group::E2E failure output"
          sed -n '1,150p' test-results/e2e-output.txt || true
          echo "::endgroup::"
          # Emit the notable failure lines as ::error:: annotations so they
          # are visible in the checks API / Actions summary, not only inside
          # the raw (auth-gated) step logs.
          grep -aE "Error|error:|failed|Timeout|timed out|✘|toHaveCount|toBeVisible|webServer" \
            test-results/e2e-output.txt 2>/dev/null | head -40 | while IFS= read -r line; do
            echo "::error::E2E: $line"
          done || true
        timeout-minutes: 2

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
        timeout-minutes: 5

  # Staging smoke gate — VALIDATION ONLY. This job never contacts a host and
  # never runs the live smoke flow: it proves the smoke script itself is
  # syntactically valid, that its documented configuration validation modes
  # behave as specified, and that the script refuses misconfiguration before
  # any HTTP could occur. All values are deliberately non-sensitive dummies:
  #   - https://smoke.invalid  — RFC 2606 reserved TLD, never resolvable
  #   - ci-dummy-fixture-password — throwaway CI value, never a real secret
  # The live post-deploy smoke (STAGING.md §11) is executed by an operator
  # against a deployed staging API; it must never run in CI.
  smoke-validation:
    name: staging smoke gate (validation only — never contacts a host)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP (script prerequisite for JSON extraction)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Shell syntax validation
        run: bash -n smoke_staging.sh

      - name: Dry-run with non-sensitive dummy values (no HTTP performed)
        env:
          SMOKE_DRY_RUN: '1'
          STAGING_BASE_URL: 'https://smoke.invalid'
          STAGING_FIXTURE_PASSWORD: 'ci-dummy-fixture-password'
        run: ./smoke_staging.sh

      - name: Plain-HTTP remote URL is refused (exit 2)
        env:
          SMOKE_DRY_RUN: '1'
          STAGING_BASE_URL: 'http://smoke.invalid'
          STAGING_FIXTURE_PASSWORD: 'ci-dummy-fixture-password'
        run: |
          set +e
          output="$(./smoke_staging.sh 2>&1)"
          code=$?
          set -e
          if [[ "$code" -ne 2 ]]; then
            echo "::error::expected exit 2 (plain-HTTP remote refused), got ${code}"
            exit 1
          fi
          echo "$output" | grep -qi 'plain-HTTP' || {
            echo '::error::plain-HTTP refusal diagnostic missing'
            exit 1
          }

      - name: Missing STAGING_BASE_URL is refused (exit 2)
        env:
          SMOKE_DRY_RUN: '1'
          STAGING_FIXTURE_PASSWORD: 'ci-dummy-fixture-password'
        run: |
          set +e
          output="$(./smoke_staging.sh 2>&1)"
          code=$?
          set -e
          if [[ "$code" -ne 2 ]]; then
            echo "::error::expected exit 2 (missing STAGING_BASE_URL), got ${code}"
            exit 1
          fi
          echo "$output" | grep -qi 'STAGING_BASE_URL is required' || {
            echo '::error::missing-URL diagnostic absent'
            exit 1
          }

      - name: Missing STAGING_FIXTURE_PASSWORD is refused (exit 2)
        env:
          SMOKE_DRY_RUN: '1'
          STAGING_BASE_URL: 'https://smoke.invalid'
        run: |
          set +e
          output="$(./smoke_staging.sh 2>&1)"
          code=$?
          set -e
          if [[ "$code" -ne 2 ]]; then
            echo "::error::expected exit 2 (missing STAGING_FIXTURE_PASSWORD), got ${code}"
            exit 1
          fi
          echo "$output" | grep -qi 'STAGING_FIXTURE_PASSWORD is required' || {
            echo '::error::missing-password diagnostic absent'
            exit 1
          }
