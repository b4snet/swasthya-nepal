<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F766E" />
    <link rel="manifest" href="/manifest.json" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Swasthya</title>
    <!-- Design-system faces (DESIGN_SYSTEM.md §8): Public Sans body, Manrope
         display, IBM Plex Mono for identifiers, Noto Sans Devanagari fallback. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700&family=Manrope:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      /* Prevent flash of wrong theme — runs before CSS parses */
      (function(){
        var s=localStorage.getItem('swasthya-theme');
        if(s==='dark'){document.documentElement.classList.add('dark');document.documentElement.classList.remove('light');}
        else if(s==='light'){document.documentElement.classList.add('light');document.documentElement.classList.remove('dark');}
        else{document.documentElement.classList.add('light');}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
