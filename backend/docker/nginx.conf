# Swasthya API nginx server (DEPLOYMENT.md §13, SECURITY.md §23).
# Render terminates TLS at its edge and forwards to this container on :80.

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20m;

    # Laravel front controller + asset routing.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Pass PHP to fpm (listen on 127.0.0.1:9000, see php-fpm.conf).
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Never serve dotfiles or storage internals directly.
    location ~ /\.(?!well-known).* {
        deny all;
    }
    location ~ ^/(storage|bootstrap|vendor|database|tests)/ {
        deny all;
    }

    # Static assets: long-lived immutable cache (hashed filenames from Vite).
    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
