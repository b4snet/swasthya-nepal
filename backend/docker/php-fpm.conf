; Swasthya php-fpm pool (DEPLOYMENT.md §15).
[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000
listen.owner = www-data
listen.group = www-data
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; The running application must see the DB_* / APP_* env vars injected by the
; platform. DB_PASSWORD is the single runtime secret: roles.sql creates
; swasthya_app with the exact same value the app connects with (SECURITY.md
; §14). Do not clear the environment.
clear_env = no
