# ============================================================================
# Swasthya — Render Blueprint (staging)
# ============================================================================
# Provisioned via "New + > Blueprint" pointing at this repository, branch
# `main`, environment `staging`. Renders the documented staging services
# (STAGING.md §2–§9): the Laravel API as a Docker web service and the
# React/Vite SPA as a static site.
#
# DATABASE PROVIDER: Supabase managed PostgreSQL 16 (project
# bgfqwsivvhqmuwullkye). Render runs NO PostgreSQL — the app connects to
# Supabase through the SHARED POOLER in SESSION mode (port 5432; IPv4, TLS
# required). Transaction mode (6543) is deliberately NOT used: it does not
# support prepared statements and does not persist per-connection SET
# (Laravel's search_path/timezone), which would break Eloquent.
#
# Security invariants (STAGING.md §6, SECURITY.md §13–14):
#   * NO secrets in this file or anywhere in git. Every database credential
#     and key below is `sync: false` — entered once in the Render Dashboard
#     at creation time, never committed. APP_KEY is `generateValue` (generated
#     once by Render, kept in Render's env).
#   * The running API connects as the least-privilege `swasthya_app` role
#     (NOBYPASSRLS). The predeploy bootstrap (roles.sql -> migrate --force ->
#     grants.sql) runs as the Supabase `postgres` owner and ABORTS the deploy
#     on any failure (MASTER_RULES.md §30, STAGING.md §6: never
#     migrate:fresh/reset/DROP).
#   * Render terminates TLS at its edge; onrender.com URLs are HTTPS by
#     default (SECURITY.md §11).
#
# The full runbook — exact env values, first-time initialization, and the
# optional manual Supabase SQL — is in SUPABASE_STAGING.md.
# ============================================================================

projects:
  - name: swasthya-staging
    environments:
      - name: staging
        services:
          # ---- Laravel API (Docker web service) ----
          - type: web
            name: swasthya-api
            runtime: docker
            plan: starter
            region: singapore
            branch: main
            dockerfilePath: ./backend/Dockerfile
            dockerContext: ./backend
            autoDeployTrigger: commit
            healthCheckPath: /api/v1/health/ready
            preDeployCommand: |
              SWASTHYA_RUN_BOOTSTRAP=1 /usr/local/bin/docker-entrypoint
            envVars:
              # --- Application ---
              - key: APP_ENV
                value: staging
              - key: APP_DEBUG
                value: "false"
              - key: APP_KEY
                generateValue: true
              - key: APP_URL
                sync: false         # enter the service URL (https://<name>.onrender.com) at creation

              # --- Logging (structured JSON; OBSERVABILITY.md) ---
              - key: LOG_CHANNEL
                value: json
              - key: LOG_LEVEL
                value: info

              # --- Runtime database connection: least-privilege swasthya_app ---
              # Supabase shared pooler — SESSION mode (port 5432), IPv4, TLS.
              # Entered at creation from the Dashboard's session-pooler
              # connection string; the pooler username is <role>.<project-ref>.
              - key: DB_CONNECTION
                value: pgsql
              - key: DB_HOST
                sync: false         # aws-<region>.pooler.supabase.com (session pooler)
              - key: DB_PORT
                value: "5432"       # session mode — NEVER 6543 (transaction mode)
              - key: DB_DATABASE
                value: postgres      # Supabase's single database
              - key: DB_USERNAME
                sync: false         # swasthya_app.<project-ref> — runtime role, never the owner
              - key: DB_PASSWORD
                sync: false         # the swasthya_app password (created by roles.sql with this exact value)
              - key: DB_SSLMODE
                value: require      # Supabase requires TLS

              # --- Predeploy bootstrap (owner credentials; NOT used by the runtime app) ---
              # Supabase `postgres` role via the same session pooler. The
              # dashboard database password — a secret, entered at creation.
              - key: BOOTSTRAP_DB_HOST
                sync: false         # same pooler host as DB_HOST
              - key: BOOTSTRAP_DB_PORT
                value: "5432"
              - key: BOOTSTRAP_DB_DATABASE
                value: postgres
              - key: BOOTSTRAP_DB_USERNAME
                sync: false         # postgres.<project-ref>
              - key: BOOTSTRAP_DB_PASSWORD
                sync: false         # Supabase dashboard database password (owner)

              # --- CORS (SECURITY.md §24): the SPA origin(s) only ---
              - key: SWASTHYA_CORS_ALLOWED_ORIGINS
                sync: false         # enter https://<frontend-name>.onrender.com at creation

              # --- Rate limits (prod-like values; SECURITY.md §17) ---
              - key: SWASTHYA_RATE_LIMIT_AUTH
                value: "5"
              - key: SWASTHYA_RATE_LIMIT_API
                value: "120"
              - key: SWASTHYA_RATE_LIMIT_WRITES
                value: "60"

              # --- Sessions / cache / queues (staging v1: database-backed) ---
              - key: SESSION_DRIVER
                value: database
              - key: SESSION_SECURE_COOKIE
                value: "true"
              - key: CACHE_STORE
                value: database
              - key: QUEUE_CONNECTION
                value: sync

          # ---- React/Vite SPA (static site) ----
          - type: web
            name: swasthya-frontend
            runtime: static
            branch: main
            rootDir: frontend
            buildCommand: npm ci && npm run build
            staticPublishPath: ./dist
            autoDeployTrigger: commit
            envVars:
              # The SPA's API base URL. Same-origin by default; on Render the
              # SPA and API are separate origins, so point at the API service
              # URL (set at creation; the value is not a secret).
              - key: VITE_API_BASE_URL
                sync: false         # enter https://<api-name>.onrender.com at creation
            headers:
              - path: /*
                name: X-Content-Type-Options
                value: nosniff
              - path: /*
                name: X-Frame-Options
                value: DENY
              - path: /*
                name: Referrer-Policy
                value: strict-origin-when-cross-origin
